<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Spider-verse gradient -->
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Mask / Badge Base -->
  <path d="M 50 4 
           C 78 4, 94 24, 94 52 
           C 94 76, 74 94, 50 98 
           C 26 94, 6 76, 6 52 
           C 6 24, 22 4, 50 4 Z" 
        fill="url(#spiderGlow)" 
        stroke="#000000" 
        stroke-width="5" />

  <!-- Web Lines Inside Mask -->
  <!-- Vertical center web -->
  <line x1="50" y1="4" x2="50" y2="98" stroke="#000000" stroke-width="2.5" />
  <!-- Diagonals -->
  <line x1="16" y1="20" x2="84" y2="80" stroke="#000000" stroke-width="2.2" opacity="0.7"/>
  <line x1="84" y1="20" x2="16" y2="80" stroke="#000000" stroke-width="2.2" opacity="0.7"/>
  <line x1="6" y1="52" x2="94" y2="52" stroke="#000000" stroke-width="2.2" opacity="0.7"/>

  <!-- Web arcs -->
  <path d="M 36 28 Q 50 36 64 28" fill="none" stroke="#000000" stroke-width="2.2" />
  <path d="M 28 46 Q 50 58 72 46" fill="none" stroke="#000000" stroke-width="2.2" />
  <path d="M 34 68 Q 50 80 66 68" fill="none" stroke="#000000" stroke-width="2.2" />

  <!-- Iconic Spidey Eyes (Left Eye) -->
  <!-- Black Eye Outer Rim -->
  <path d="M 45 42 
           C 42 54, 32 67, 18 69 
           C 15 69, 14 65, 16 60 
           C 23 44, 35 34, 45 42 Z" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
  <!-- White Eye Center -->
  <path d="M 42 45 
           C 39 54, 31 63, 21 65 
           C 20 64, 20 62, 22 58 
           C 27 47, 36 39, 42 45 Z" 
        fill="#ffffff" />

  <!-- Iconic Spidey Eyes (Right Eye) -->
  <!-- Black Eye Outer Rim -->
  <path d="M 55 42 
           C 58 54, 68 67, 82 69 
           C 85 69, 86 65, 84 60 
           C 77 44, 65 34, 55 42 Z" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
  <!-- White Eye Center -->
  <path d="M 58 45 
           C 61 54, 69 63, 79 65 
           C 80 64, 80 62, 78 58 
           C 73 47, 64 39, 58 45 Z" 
        fill="#ffffff" />
</svg>
